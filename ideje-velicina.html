<title>Ideje nemaju veličinu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: copy column left, particle stage right (stacks on phone); 4-stop size control under the stage drives both */
:root{
  --navy:#0B1020; --deep:#080C19; --surface:#121A30; --line:#2A3658; --gold:#D9B25F; --ink:#F3EEE3; --muted:#A7AEC2;
  --display:'Montserrat',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--navy);color:var(--ink)}
body{font-family:var(--display)}
*{box-sizing:border-box}
.sec{max-width:1240px;margin:0 auto;padding-block:clamp(48px,9vh,110px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,72px);align-items:center}
.copy{display:flex;flex-direction:column;gap:20px;min-width:0}
.tag{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h2{margin:0;font-weight:900;font-size:clamp(36px,5.2vw,68px);line-height:.98;letter-spacing:-.025em;text-wrap:balance}
h2 em{font-style:normal;color:var(--gold)}
.lead{margin:0;color:var(--muted);font-size:clamp(15px,1.4vw,18px);line-height:1.55;max-width:44ch}
.case{border-top:1px solid var(--line);padding-top:20px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;row-gap:10px;align-items:baseline}
.case dt{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.case dd{margin:0;font-size:17px;font-weight:700;line-height:1.35;min-height:1.35em}
.case dd.idea{color:var(--gold)}
.noise{font-family:var(--mono);color:var(--gold);opacity:.8}
.rest{color:transparent}
.foot{margin:6px 0 0;font-size:14px;line-height:1.5;color:var(--muted);max-width:44ch}

.stagewrap{display:flex;flex-direction:column;gap:18px;min-width:0}
.stage{position:relative;width:100%;aspect-ratio:7/5;border-radius:28px;background:radial-gradient(120% 90% at 50% 100%,#111a33 0%,var(--deep) 70%);border:1px solid #18213d;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scale{position:absolute;left:18px;top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.scale b{color:var(--ink);font-weight:600}

.ctl{position:relative;padding:0 6px}
.track{position:relative;height:4px;border-radius:2px;background:var(--line);margin:0 calc(12.5% - 6px)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--gold);width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.stops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:-14px}
.stop{appearance:none;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-family:var(--display);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:56px}
.stop i{width:24px;height:24px;border-radius:50%;background:var(--navy);border:2px solid var(--line);transition:.3s}
.stop[aria-pressed="true"]{color:var(--ink)}
.stop[aria-pressed="true"] i{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 6px rgba(217,178,95,.15)}
.stop:focus-visible i{outline:2px solid var(--gold);outline-offset:4px}
.hint{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}

@media (max-width:820px){
  .sec{grid-template-columns:minmax(0,1fr)}
  .stagewrap{order:2}
  .stage{aspect-ratio:1/1}
  .stop{font-size:12px}
}
</style>

<section class="sec" aria-labelledby="t">
  <div class="copy">
    <div class="tag">03 · Za svaku veličinu</div>
    <h2 id="t">Ideje nemaju <em>veličinu firme.</em></h2>
    <p class="lead">Pomerite veličinu firme. Problem se menja, ideja ostaje iste veličine.</p>
    <dl class="case" aria-live="polite">
      <dt>Ko</dt><dd id="who"></dd>
      <dt>Problem</dt><dd id="prob"></dd>
      <dt>Ideja</dt><dd id="idea" class="idea"></dd>
    </dl>
    <p class="foot">Rešenje ne biramo po veličini klijenta, nego po problemu, potencijalu i saradnji.</p>
  </div>

  <div class="stagewrap">
    <div class="stage" id="stage">
      <canvas id="c" aria-hidden="true"></canvas>
      <div class="scale">Veličina firme: <b id="sz"></b></div>
    </div>
    <div class="ctl">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="stops" role="group" aria-label="Veličina firme">
        <button class="stop" data-i="0" aria-pressed="false"><i></i>Lokalni biznis</button>
        <button class="stop" data-i="1" aria-pressed="false"><i></i>Restoran</button>
        <button class="stop" data-i="2" aria-pressed="false"><i></i>Online prodavnica</button>
        <button class="stop" data-i="3" aria-pressed="false"><i></i>Veća firma</button>
      </div>
    </div>
    <div class="hint">Strelice levo/desno ili prevucite po sceni</div>
  </div>
</section>

<script>
(function(){
  var DATA=[
    {sz:'1 lokal',who:'Frizerski salon u kraju',prob:'Termini se dogovaraju telefonom i porukama.',idea:'Online zakazivanje sa podsetnikom.'},
    {sz:'1 objekat · 12 ljudi',who:'Restoran u centru',prob:'Gosti dolaze preko platformi, a restoran ih ne poznaje.',idea:'Sopstvene rezervacije i baza gostiju.'},
    {sz:'magacin + web',who:'Online prodavnica',prob:'Ljudi kupe jednom i ne vrate se.',idea:'Podsetnici, lojalnost i preporuke.'},
    {sz:'više sektora',who:'Veća firma',prob:'Pet alata koji ne pričaju međusobno.',idea:'Jedan povezan sistem i jasni podaci.'}
  ];
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
  var W=0,H=0,DPR=1,N=0,P=[],cur=-1,t0=performance.now();

  /* building layouts per size: [x offset, width, height] in "units"; scaled to fit a footprint */
  var LAY=[
    {foot:.16,b:[[0,1,1.15]]},
    {foot:.32,b:[[0,1.5,1],[1.6,1,1.45]]},
    {foot:.52,b:[[0,1,1.3],[1.1,1.4,0.9],[2.6,1,1.8],[3.7,.9,1.1]]},
    {foot:.86,b:[[0,.9,1.2],[1,1,1.9],[2.1,1,2.6],[3.2,1,3.3],[4.3,1,2.4],[5.4,.9,1.6],[6.4,1.2,1.1]]}
  ];
  function targets(i){
    var L=LAY[i],b=L.b,maxX=0,maxH=0;
    b.forEach(function(r){maxX=Math.max(maxX,r[0]+r[1]);maxH=Math.max(maxH,r[2])});
    var foot=W*L.foot, u=foot/maxX, hu=Math.min(u, (H*.62)/maxH);
    var x0=(W-foot)/2, base=H*.84, pts=[];
    var step=Math.max(5,Math.min(9,W/110));
    b.forEach(function(r){
      var x=x0+r[0]*u, w=r[1]*u, h=r[2]*hu, y=base-h;
      for(var px=x;px<=x+w;px+=step){pts.push([px,y]);}
      for(var py=y;py<=base;py+=step){pts.push([x,py]);pts.push([x+w,py]);}
      /* windows */
      var cols=Math.max(1,Math.floor(w/(step*2.6))), rows=Math.max(1,Math.floor(h/(step*3)));
      for(var cx=0;cx<cols;cx++)for(var ry=0;ry<rows;ry++){
        pts.push([x+w*(cx+.5)/cols, y+step*2+ry*(h-step*3)/Math.max(1,rows)]);
      }
    });
    for(var gx=W*.06;gx<W*.94;gx+=step*1.4) pts.push([gx,base+step*.9]);
    return pts;
  }
  function resize(){
    var r=stage.getBoundingClientRect();
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
    N=W<500?520:900;
    while(P.length<N)P.push({x:Math.random()*W,y:Math.random()*H,tx:0,ty:0,a:0,ta:0,s:Math.random()*1+.8,ph:Math.random()*6.28});
    P.length=N;
    if(cur>=0)assign(cur,true);
  }
  function assign(i,snap){
    var T=targets(i);
    for(var k=0;k<N;k++){
      var p=P[k];
      if(k<T.length){var t=T[(k*7919)%T.length];p.tx=t[0];p.ty=t[1];p.ta=1;}
      else{p.tx=Math.random()*W;p.ty=Math.random()*H*.75;p.ta=.18;}
      p.d=Math.random()*.25;
      if(snap||reduce){p.x=p.tx;p.y=p.ty;p.a=p.ta;}
    }
  }

  /* scramble text */
  var GL='ABCDEFGHIJKLMNOPRSTUVZŠĐČĆŽ0123456789#%/+';
  var lines=[{el:document.getElementById('who')},{el:document.getElementById('prob')},{el:document.getElementById('idea')}];
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function setText(i){
    var d=DATA[i],now=performance.now();
    [d.who,d.prob,d.idea].forEach(function(s,j){lines[j].t=s;lines[j].st=now+j*140;});
  }
  function drawText(now){
    lines.forEach(function(l){
      if(!l.t)return;
      var n=l.t.length,k=reduce?1:Math.min(1,Math.max(0,(now-l.st)/(n*22))),done=Math.floor(k*n);
      var nz=(k<=0||k>=1)?0:Math.min(4,n-done),z='';
      for(var j=0;j<nz;j++){var ch=l.t[done+j];z+=ch===' '?' ':GL[(Math.random()*GL.length)|0];}
      var html=esc(l.t.slice(0,done))+'<span class="noise">'+esc(z)+'</span><span class="rest">'+esc(l.t.slice(done+nz))+'</span>';
      if(html!==l.last){l.el.innerHTML=html;l.last=html;}
    });
  }

  function core(now){
    var cx=W/2,cy=H*.42,R=Math.max(34,Math.min(W,H)*.075);
    var pulse=reduce?1:1+Math.sin(now/900)*.04;
    var g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*3.2);
    g.addColorStop(0,'rgba(217,178,95,.45)');g.addColorStop(1,'rgba(217,178,95,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*3.2,0,6.283);ctx.fill();
    ctx.fillStyle='#D9B25F';ctx.beginPath();ctx.arc(cx,cy,R*pulse,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(217,178,95,.35)';ctx.lineWidth=1;ctx.setLineDash([3,6]);
    ctx.beginPath();ctx.arc(cx,cy,R*1.55,0,6.283);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#0B1020';ctx.font='800 '+Math.round(R*.34)+'px Montserrat, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('IDEJA',cx,cy+1);
  }
  function frame(now){
    ctx.clearRect(0,0,W,H);
    var dt=Math.min(1,(now-t0)/1000);
    for(var k=0;k<N;k++){
      var p=P[k],e=reduce?1:.075;
      p.x+=(p.tx-p.x)*e;p.y+=(p.ty-p.y)*e;p.a+=(p.ta-p.a)*e;
      var tw=p.ta<1?(.5+.5*Math.sin(now/700+p.ph)):1;
      ctx.globalAlpha=p.a*tw*.9;
      ctx.fillStyle=p.ta<1?'#4A5678':'#C9D2EA';
      ctx.fillRect(p.x,p.y,p.s*1.6,p.s*1.6);
    }
    ctx.globalAlpha=1;
    core(now);
    drawText(now);
    if(!reduce)requestAnimationFrame(frame);
  }

  var stops=[].slice.call(document.querySelectorAll('.stop')),fill=document.getElementById('fill'),sz=document.getElementById('sz');
  function go(i){
    if(i===cur||i<0||i>3)return;cur=i;
    stops.forEach(function(b,j){b.setAttribute('aria-pressed',j===i?'true':'false')});
    fill.style.width=(i/3*100)+'%';
    sz.textContent=DATA[i].sz;
    assign(i,false);setText(i);
    if(reduce)frame(performance.now());
  }
  stops.forEach(function(b){b.addEventListener('click',function(){go(+b.dataset.i)})});
  document.addEventListener('keydown',function(e){
    if(e.target.closest&&e.target.closest('input,textarea'))return;
    if(e.key==='ArrowRight')go(Math.min(3,cur+1));
    if(e.key==='ArrowLeft')go(Math.max(0,cur-1));
  });
  /* drag across the stage = slider */
  var drag=false;
  function fromX(x){var r=stage.getBoundingClientRect();go(Math.max(0,Math.min(3,Math.floor((x-r.left)/r.width*4))))}
  stage.addEventListener('pointerdown',function(e){drag=true;fromX(e.clientX)});
  addEventListener('pointermove',function(e){if(drag)fromX(e.clientX)});
  addEventListener('pointerup',function(){drag=false});

  new ResizeObserver(resize).observe(stage);
  resize();
  go(1);
  for(var k=0;k<N;k++){P[k].x=P[k].tx;P[k].y=P[k].ty;P[k].a=P[k].ta;}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(reduce)frame(performance.now())});
  if(reduce)frame(performance.now());else requestAnimationFrame(frame);
})();
</script>

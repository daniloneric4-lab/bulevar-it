<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sistem iza ekrana mobilni v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1020;--ink:#F3EEE3;--mut:#A7AEC2;--gold:#D9B25F}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:Montserrat,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",monospace}
.nav{position:fixed;top:12px;left:12px;right:12px;z-index:20;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 18px;border-radius:26px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.nav .logo{font:600 17px "IBM Plex Mono",monospace}.nav .logo b{color:var(--gold);font-weight:600}
.burger{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center}
.burger i{display:block;width:16px;height:2px;background:var(--ink);box-shadow:0 -5px 0 var(--ink),0 5px 0 var(--ink)}
.pad{height:70vh;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8vh;color:var(--mut);font-size:12px;letter-spacing:.2em}

/* sekcija */
.sis{position:relative;height:600vh}
.st{position:sticky;top:0;height:100vh;height:100svh;display:flex;flex-direction:column;padding:84px 20px 12px;max-width:560px;margin:0 auto;overflow:hidden}
/* tekst: ostaje vaš postojeći (ovde samo statična zamena) */
.hd .kick{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:600}
.hd h2{margin-top:10px;font-weight:900;font-size:clamp(26px,7.6vw,34px);line-height:1.04;letter-spacing:-.02em}
.hd p.d{margin-top:10px;color:#D9B25F;font-size:14.5px;line-height:1.5;opacity:.9}
.scene{position:relative;flex:1;min-height:0;margin:0 -20px}
.scene canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.end{height:60vh;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;letter-spacing:.2em}
</style>
</head>
<body>
<nav class="nav"><div class="logo">Bulevar<b>.IT</b></div><div class="burger"><i></i></div></nav>
<div class="pad mono">↓ SKROLUJTE · PROTOTIP ZA MOBILNI</div>

<section class="sis" id="sistem">
  <div class="st">
    <div class="hd">
      <p class="kick mono" id="kick">01 / 05 · ISKUSTVO</p>
      <h2 id="h">Ekran, poruka i tok koji korisnik vidi.</h2>
      <p class="d" id="p">Ovo je deo koji svi vide: sajt, poruka, dugme.</p>
    </div>
    <div class="scene" id="scene"></div>
  </div>
</section>
<div class="end mono">SLEDEĆA SEKCIJA</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
/* tekst je ovde samo da se vidi kontekst – na sajtu ostaje vaša postojeća animacija slova */
const L=[['ISKUSTVO','Ekran, poruka i tok koji korisnik vidi.','Ovo je deo koji svi vide: sajt, poruka, dugme.'],
 ['KONVERZIJA','Upit, rezervacija ili kupovina.','Posetilac postaje gost, direktno kod vas.'],
 ['PODACI','Odakle je došao i šta je uradio.','Znate šta donosi rezervacije, a šta troši novac.'],
 ['AUTOMATIZACIJA','Obaveštenja, follow-up, AI asistent.','Sve što se ponavlja radi samo.'],
 ['ZADRŽAVANJE','Povratak, preporuka, lojalnost.','Gost se vraća direktno kod vas i dovodi prijatelje.']];

const cl=x=>Math.max(0,Math.min(1,x)), seg=(t,a,b)=>cl((t-a)/(b-a)), eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, lerp=(a,b,t)=>a+(b-a)*t;
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)}

/* ===== ekran: sajt (sloj 01) ===== */
const W=1280,H=800, sc=document.createElement('canvas'); sc.width=W; sc.height=H; const c=sc.getContext('2d');
const stars=[...Array(70)].map(()=>[Math.random()*W,90+Math.random()*330,Math.random()*2+.6,Math.random()*6]);
function screen(now){
  const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#141A3A'); g.addColorStop(.62,'#2A2550'); g.addColorStop(1,'#1A1A33');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  stars.forEach(([x,y,r,ph])=>{c.globalAlpha=.35+.35*Math.sin(now/700+ph);c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,7);c.fill()}); c.globalAlpha=1;
  c.fillStyle='#F3E3AE';c.beginPath();c.arc(1010,200,52,0,7);c.fill();c.fillStyle='#232450';c.beginPath();c.arc(1034,186,48,0,7);c.fill();
  c.fillStyle='#1F1D3A';c.beginPath();c.moveTo(0,600);c.quadraticCurveTo(640,520,W,600);c.lineTo(W,H);c.lineTo(0,H);c.fill();
  c.strokeStyle='rgba(167,174,194,.18)';c.lineWidth=3;for(let k=-8;k<=8;k++){c.beginPath();c.moveTo(640+k*30,580);c.lineTo(640+k*190,H);c.stroke()}
  c.fillStyle='#3B3F6A';c.fillRect(830,520,120,80);c.beginPath();c.moveTo(818,522);c.lineTo(890,470);c.lineTo(962,522);c.fill();
  c.fillStyle='rgba(242,201,110,.9)';c.fillRect(852,545,24,26);c.fillRect(900,545,24,26);
  c.fillStyle='rgba(11,16,32,.55)';c.fillRect(0,0,W,84);
  c.font='800 34px Montserrat, sans-serif';c.fillStyle='#F3EEE3';c.textAlign='left';c.fillText('Kuća pod Fruškom',48,55);
  c.font='600 24px Montserrat, sans-serif';c.fillStyle='#C9CDDA';['Kuća','Okolina','Cene'].forEach((s,k)=>c.fillText(s,880+k*130,52));
  c.font='900 78px Montserrat, sans-serif';c.fillStyle='#F3EEE3';c.fillText('Vikend koji',60,260);c.fillText('počinje u vinogradu.',60,350);
  rr(c,60,400,340,82,41);c.fillStyle='#D9B25F';c.fill();
  c.font='800 30px Montserrat, sans-serif';c.fillStyle='#0B1020';c.fillText('Rezerviši direktno',100,452);
}

/* ===== slojevi 02–05 (sadržaj = vaše postojeće kartice; ovde primer) ===== */
const CW=1280,CH=800;
const CARDS=[
 {t:'02 · KONVERZIJA',s:'REZERVACIJA ZA 40 SEKUNDI',box:['Petak 13. – nedelja 15. jun · 2 osobe','Terasa sa pogledom na vinograd'],btn:['Potvrdi rezervaciju','180 €']},
 {t:'03 · PODACI',s:'ODAKLE SU DOŠLI OVOG MESECA',bars:[['Google oglas',.46],['Instagram',.31],['Direktno / preporuka',.23]]},
 {t:'04 · AUTOMATIZACIJA',s:'RADI SAMO, BEZ VAS',rows:[['✓ Potvrda poslata gostu','odmah'],['✓ Podsetnik pred dolazak','dan ranije']],box:['AI asistent: „Da, parking je besplatan.“']},
 {t:'05 · ZADRŽAVANJE',s:'11 MESECI POSLE BORAVKA',box:['Ana, prošlo je skoro godinu dana od vašeg vikenda.','Terasa je slobodna 13–15. juna. Za povratak: −10%.','Rezerviši ponovo →'],kp:[['Povratni gosti','38%'],['Preporuke','14 ove godine'],['Ocena','4,9']]},
];
function cardTex(d){
  const cv=document.createElement('canvas'); cv.width=CW; cv.height=CH; const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,CW,CH); g.addColorStop(0,'#1E2850'); g.addColorStop(1,'#111830');
  rr(x,6,6,CW-12,CH-12,44); x.fillStyle=g; x.fill(); x.lineWidth=10; x.strokeStyle='#D9B25F'; x.stroke();
  x.textAlign='left'; x.font='600 40px "IBM Plex Mono", monospace'; x.fillStyle='#D9B25F'; x.fillText(d.t,64,104);
  x.font='500 30px "IBM Plex Mono", monospace'; x.fillStyle='#A7AEC2'; x.fillText(d.s,64,152);
  let y=196;
  const box=(lines,h)=>{rr(x,64,y,CW-128,h,26);x.fillStyle='rgba(11,16,32,.6)';x.fill();x.lineWidth=2;x.strokeStyle='rgba(167,174,194,.2)';x.stroke();
    lines.forEach((l,k)=>{const last=k===lines.length-1&&l.endsWith('→');x.font=`${last?800:700} ${last?38:40}px Montserrat, sans-serif`;x.fillStyle=last||(!d.kp&&k===1&&d.btn)?'#D9B25F':'#F3EEE3';x.fillText(l,100,y+70+k*58)});y+=h+30};
  if(d.rows) d.rows.forEach(([a,b])=>{x.font='700 42px Montserrat, sans-serif';x.fillStyle='#F3EEE3';x.fillText(a,64,y+44);x.textAlign='right';x.font='500 34px Montserrat, sans-serif';x.fillStyle='#A7AEC2';x.fillText(b,CW-64,y+44);x.textAlign='left';y+=78});
  if(d.box) box(d.box,d.box.length*58+44);
  if(d.bars) d.bars.forEach(([a,v])=>{x.font='700 42px Montserrat, sans-serif';x.fillStyle='#F3EEE3';x.fillText(a,64,y+44);x.textAlign='right';x.fillStyle='#A7AEC2';x.fillText(Math.round(v*100)+'%',CW-64,y+44);x.textAlign='left';
    rr(x,64,y+66,CW-128,18,9);x.fillStyle='rgba(255,255,255,.08)';x.fill();rr(x,64,y+66,(CW-128)*v,18,9);x.fillStyle='#D9B25F';x.fill();y+=140});
  if(d.btn){rr(x,64,y,CW-128,100,50);x.fillStyle='#D9B25F';x.fill();x.font='800 42px Montserrat, sans-serif';x.fillStyle='#0B1020';x.fillText(d.btn[0],110,y+64);x.textAlign='right';x.fillText(d.btn[1],CW-110,y+64);x.textAlign='left'}
  if(d.kp){const w=(CW-128-40)/3; d.kp.forEach(([a,b],k)=>{const xx=64+k*(w+20);rr(x,xx,y,w,150,22);x.fillStyle='rgba(11,16,32,.55)';x.fill();
    x.font='600 30px Montserrat, sans-serif';x.fillStyle='#A7AEC2';x.fillText(a,xx+28,y+52);x.font='900 48px Montserrat, sans-serif';x.fillStyle='#F3EEE3';x.fillText(b,xx+28,y+116)})}
  return cv;
}

/* ===== three.js ===== */
const host=document.getElementById('scene');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true}); R.setPixelRatio(Math.min(devicePixelRatio,2)); host.appendChild(R.domElement);
if(THREE.sRGBEncoding) R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene(), cam=new THREE.PerspectiveCamera(30,1,.1,100);
S.add(new THREE.AmbientLight(0xffffff,.5));
const dl=new THREE.DirectionalLight(0xffffff,.8); dl.position.set(2,6,5); S.add(dl);
const LW=3.3,LD=2.25,BH=.11,LH=2.12,LT=.06, SW=LW-.18, SH=SW*H/W;
const metal=new THREE.MeshStandardMaterial({color:0x111522,metalness:.55,roughness:.45});
const lap=new THREE.Group(); S.add(lap);
lap.add(new THREE.Mesh(new THREE.BoxGeometry(LW,BH,LD),metal));
const kc=document.createElement('canvas');kc.width=1024;kc.height=700;const k=kc.getContext('2d');
k.fillStyle='#10131E';k.fillRect(0,0,1024,700);
for(let r=0;r<6;r++)for(let q=0;q<14;q++){k.fillStyle='#05070D';k.fillRect(40+q*68,40+r*60,58,50);k.strokeStyle='rgba(180,190,220,.25)';k.lineWidth=2;k.strokeRect(40+q*68,40+r*60,58,50)}
k.fillStyle='#1A1E2C';k.fillRect(340,470,340,200);
const kb=new THREE.Mesh(new THREE.PlaneGeometry(LW*.94,LD*.9),new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(kc),metalness:.2,roughness:.8}));
kb.rotation.x=-Math.PI/2; kb.position.y=BH/2+.002; lap.add(kb);
const hinge=new THREE.Group(); hinge.position.set(0,BH/2,-LD/2+.02); hinge.rotation.x=-.2; lap.add(hinge);
const lid=new THREE.Mesh(new THREE.BoxGeometry(LW,LH,LT),metal); lid.position.y=LH/2; hinge.add(lid);
const bez=new THREE.Mesh(new THREE.PlaneGeometry(LW-.05,LH-.05),new THREE.MeshBasicMaterial({color:0x03050A})); bez.position.set(0,LH/2,LT/2+.001); hinge.add(bez);
const tex=new THREE.CanvasTexture(sc); tex.anisotropy=R.capabilities.getMaxAnisotropy(); if(THREE.sRGBEncoding) tex.encoding=THREE.sRGBEncoding;
const scr=new THREE.Mesh(new THREE.PlaneGeometry(SW,SH),new THREE.MeshBasicMaterial({map:tex,toneMapped:false}));
scr.position.set(0,LH/2+.03,LT/2+.002); hinge.add(scr);

/* slojevi IZA ekrana: svaki ima svoje mesto u špilu iza poklopca */
const layers=CARDS.map((d,j)=>{
  const t=new THREE.CanvasTexture(cardTex(d)); t.anisotropy=R.capabilities.getMaxAnisotropy(); if(THREE.sRGBEncoding) t.encoding=THREE.sRGBEncoding;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(SW,SH),new THREE.MeshBasicMaterial({map:t,transparent:true,toneMapped:false}));
  hinge.add(m); return m;});
/* zlatne linije: od sloja napred do njegovog mesta u špilu (veza "iza ekrana") */
const lineMat=new THREE.LineBasicMaterial({color:0xD9B25F,transparent:true,opacity:0});
const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(12),3));
const lines=new THREE.LineSegments(lg,lineMat); hinge.add(lines);

const shd=new THREE.Mesh(new THREE.PlaneGeometry(6,4),new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,map:(()=>{const g=document.createElement('canvas');g.width=g.height=256;const x=g.getContext('2d');const r=x.createRadialGradient(128,128,8,128,128,128);r.addColorStop(0,'rgba(0,0,0,.6)');r.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=r;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(g)})()}));
shd.rotation.x=-Math.PI/2; shd.position.y=-BH/2-.01; lap.add(shd);

function size(){const w=host.clientWidth,h=host.clientHeight; if(!w||!h) return; R.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix()}
addEventListener('resize',size); size();

/* mesto sloja j u špilu (mobilni: špil ide GORE i desno iza ekrana, da stane u usku širinu) */
const slot=(j,spread)=>({x:.045*(j+1)*spread, y:LH/2+.03+.17*(j+1)*spread, z:-.07-.16*(j+1)*spread});
const front={x:0,y:LH/2+.16,z:.55};

const sec=document.getElementById('sistem'); let sp=0, cur=-1;
function setText(i){ if(i===cur) return; cur=i; const l=L[i];
  document.getElementById('kick').textContent=`0${i+1} / 05 · ${l[0]}`; document.getElementById('h').textContent=l[1]; document.getElementById('p').textContent=l[2];}

function frame(now){
  const r=sec.getBoundingClientRect(), span=sec.offsetHeight-innerHeight;
  const target=cl(-r.top/span); sp+=(target-sp)*.11; if(Math.abs(target-sp)<1e-4) sp=target;
  if(r.top<innerHeight&&r.bottom>0){
    const P=sp*5, i=Math.min(4,Math.floor(P)), t=P-i;
    setText(i);
    screen(now); tex.needsUpdate=true;
    // uvod: špil se razmakne iza ekrana (vidi se "sistem iza ekrana")
    const spread=.35+.65*eo(cl((1-r.top/innerHeight-.3)/.6));
    let outMax=0, lp=null;
    layers.forEach((m,j)=>{ const s=j+1; // sloj j pripada koraku s
      let out=0; if(s===i) out=eio(seg(t,.05,.45)); else if(s===i-1) out=1-eio(seg(t,0,.3));
      if(s===4&&i===4) out=eio(seg(t,.05,.45));
      outMax=Math.max(outMax,out);
      const a=slot(j,spread);
      m.position.set(lerp(a.x,front.x,out),lerp(a.y,front.y,out),lerp(a.z,front.z,out));
      const sc=lerp(.96,1.02,out); m.scale.set(sc,sc,1);
      const dim=lerp(.62,1,out); m.material.color.setRGB(dim,dim,dim);
      m.renderOrder=out>0?10:1;
      if(out>.02&&(!lp||out>lp.out)) lp={m,a,out};
    });
    // linije od kartice nazad do njenog mesta
    if(lp){const p=lg.attributes.position.array, hw=SW/2*lp.m.scale.x, hh=SH/2;
      const A=[lp.m.position.x+hw,lp.m.position.y+hh,lp.m.position.z, lp.a.x+hw*.96,lp.a.y+hh*.96,lp.a.z,
               lp.m.position.x+hw,lp.m.position.y-hh,lp.m.position.z, lp.a.x+hw*.96,lp.a.y-hh*.96,lp.a.z];
      A.forEach((v,q)=>p[q]=v); lg.attributes.position.needsUpdate=true; lineMat.opacity=.55*Math.sin(Math.PI*cl(lp.out))+.15*lp.out}
    else lineMat.opacity=0;
    // laptop: okrenut bočno dok se vidi špil, frontalno dok se čita kartica
    lap.rotation.y=lerp(-.48,-.1,outMax);
    lap.rotation.x=.05;
    lap.position.set(lerp(-.3,0,outMax),-.7+Math.sin(now/1700)*.02,0);
    // kamera: laptop + špil uvek staju u širinu
    const vf=cam.fov*Math.PI/180, hf=2*Math.atan(Math.tan(vf/2)*cam.aspect);
    const fw=lerp(4.25,3.45,outMax); const z=Math.max(fw/2/Math.tan(hf/2), 3.6/2/Math.tan(vf/2));
    cam.position.set(0,1.05,z); cam.lookAt(0,.82,0);
    R.render(S,cam);
  }
  requestAnimationFrame(frame);
}
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(frame));
})();
</script>
</body>
</html>

</body></html>

<title>O nama u tačkama</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* "O nama" in five huge dot figures. Pinned stage, one canvas. Thousands of dots form BULEVAR.IT, then explode and
   re-form into 18 → 25+ → 5 → 1, each with a decoded caption. At the end the "1" collapses into the semicircle of
   dots that the existing O nama → Ideje transition starts from. Dots shy away from the cursor. */
:root{
  --navy:#0B1020; --line:#2A3658; --gold:#D9B25F; --orange:#E8963A; --ink:#F3EEE3; --muted:#A7AEC2;
  --display:'Montserrat',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{margin:0;background:var(--navy);color:var(--ink)}
body{font-family:var(--display)}
*{box-sizing:border-box}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.spacer{min-height:45vh;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.track{position:relative;height:720vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;left:0;right:0;bottom:clamp(22px,6vh,64px);pointer-events:none}
.cap .wrap{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,4vw,56px);align-items:end}
.meta{display:flex;flex-direction:column;gap:8px}
.tag{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.cnt{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--muted);font-variant-numeric:tabular-nums}
.cnt b{color:var(--orange);font-weight:600}
.txt{max-width:640px}
.txt h2{margin:0 0 8px;font-weight:900;font-size:clamp(20px,2.2vw,32px);line-height:1.12;letter-spacing:-.01em;min-height:1.15em}
.txt p{margin:0;color:var(--muted);font-size:clamp(14px,1.2vw,17px);line-height:1.55;min-height:3.1em}
.noise{font-family:var(--mono);color:var(--orange)}.rest{color:transparent}
.bar{position:absolute;left:0;top:0;height:3px;background:var(--gold);width:0}
@media (max-width:760px){.cap .wrap{grid-template-columns:minmax(0,1fr);gap:10px}.meta{flex-direction:row;gap:14px;align-items:baseline}}
</style>

<div class="spacer pad">↑ 01 · Hero · skrolujte ↓</div>

<div class="track" id="track"><div class="stage" id="stage">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div class="bar" id="bar"></div>
  <div class="cap pad"><div class="wrap">
    <div class="meta"><div class="tag">02 · O nama</div><div class="cnt"><b id="ci">01</b> / 05</div></div>
    <div class="txt" aria-live="polite"><h2 id="th"></h2><p id="tp"></p></div>
  </div></div>
</div></div>

<div class="spacer pad">↓ 03 · Ideje nemaju veličinu firme</div>

<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function cl(x){return Math.max(0,Math.min(1,x))}
  function sm(a,b,x){x=cl((x-a)/(b-a));return x*x*(3-2*x)}
  var $=function(id){return document.getElementById(id)};
  /* figure text: main part / accent part (gold-orange); captions */
  var F=[
    {m:'BULEVAR',a:'.IT',h:'Studio iz Novog Sada.',p:'Pravimo digitalne sisteme koji posle ostaju u rukama vlasnika.'},
    {m:'18',a:'',h:'Najmlađi u timu imaju 18 godina.',p:'Rastu uz alate koji su izašli prošle nedelje. Brzi su i ne boje se novog.'},
    {m:'25',a:'+',h:'Godina iskustva mentora u marketingu.',p:'Znaju šta prodaje i zašto. Paze da sve što napravimo ima poslovni smisao.'},
    {m:'5',a:'',h:'Zanata u jednoj ekipi.',p:'Srednjoškolci, mentori, programeri, fotografi i dron operateri, za istim stolom.'},
    {m:'1',a:'',h:'Sistem. I ostaje vaš.',p:'Ne iznajmljujemo vam sajt. Gradimo ga za vas, i ključevi ostaju kod vas.'}
  ];
  var cv=$('cv'),x=cv.getContext('2d'),W=0,H=0,dpr=Math.min(2,devicePixelRatio||1),STEP=12,N=0,P=[],SH=[],ARC=[];
  var off=document.createElement('canvas'),ox=off.getContext('2d',{willReadFrequently:true});

  /* sample a figure into dot positions on the grid */
  function sample(f){var mob=W<760,stepS=STEP;off.width=W;off.height=H;ox.clearRect(0,0,W,H);
    var txt=f.m+f.a,size=400;ox.font='900 '+size+'px Montserrat, sans-serif';var tw=ox.measureText(txt).width;
    var maxW=W*(mob?.92:.86),maxH=H*(mob?.42:.56);size=Math.min(size*maxW/tw,maxH/0.74);
    ox.font='900 '+size+'px Montserrat, sans-serif';ox.textBaseline='alphabetic';ox.textAlign='left';
    var mw=ox.measureText(f.m).width,aw=ox.measureText(f.a).width,x0=(W-mw-aw)/2,y0=H*(mob?.4:.44)+size*.36;
    ox.fillStyle='#fff';ox.fillText(f.m,x0,y0);ox.fillStyle='#f00';ox.fillText(f.a,x0+mw,y0);
    var d=ox.getImageData(0,0,W,H).data,o=[];
    for(var yy=stepS/2;yy<H;yy+=stepS)for(var xx=stepS/2;xx<W;xx+=stepS){var i=((yy|0)*W+(xx|0))*4;if(d[i+3]>140)o.push({x:xx,y:yy,a:d[i+1]<100})}
    return o}
  function build(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);STEP=W<760?8:12;
    SH=F.map(sample);N=Math.max.apply(null,SH.map(function(s){return s.length}));
    /* pad every shape to N: extra dots park as a faint scattered dust */
    SH=SH.map(function(s){var o=s.slice();for(var i=o.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=o[i];o[i]=o[j];o[j]=t}
      while(o.length<N)o.push({x:Math.random()*W,y:Math.random()*H,a:false,dust:true});return o});
    /* the closing semicircle, centred at the bottom */
    var R0=Math.min(W*.3,H*.42),G=W<760?10:15,CAP=Math.min(N,W<760?300:600),per=Math.ceil(CAP/5);ARC=[];for(var i=0;i<CAP;i++){var ring=i%5,k=Math.floor(i/5),a=Math.PI+(k/per)*Math.PI+(ring%2?.5:0)*Math.PI/per,rr=R0-ring*G;ARC.push({x:W/2+Math.cos(a)*rr,y:H+Math.sin(a)*rr+6,a:false})}
    for(var i=CAP;i<N;i++){var q=ARC[i%CAP];ARC.push({x:q.x,y:q.y,a:false,hide:true})}
    P=[];for(var i=0;i<N;i++)P.push({d:Math.random(),ang:Math.random()*6.283,sp:.6+Math.random()*.8,ox:0,oy:0})}

  /* decode captions */
  var GL='ABCDEFGHIJKLMNOPRSTUVZŠĐČĆŽ0123456789#%/+<>',L={h:{el:$('th'),ms:34},p:{el:$('tp'),ms:13}};
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function say(k,t,d){L[k].t=t;L[k].st=performance.now()+(d||0)}
  function text(now){for(var k in L){var l=L[k];if(!l.t)continue;var n=l.t.length,q=reduce?1:cl((now-l.st)/(n*l.ms)),dd=Math.floor(q*n),nz=(q<=0||q>=1)?0:Math.min(4,n-dd),z='';
    for(var j=0;j<nz;j++){var ch=l.t[dd+j];z+=ch===' '?' ':GL[(Math.random()*GL.length)|0]}
    var h=esc(l.t.slice(0,dd))+'<span class="noise">'+esc(z)+'</span><span class="rest">'+esc(l.t.slice(dd+nz))+'</span>';if(h!==l.h){l.el.innerHTML=h;l.h=h}}}

  var mx=-999,my=-999;addEventListener('pointermove',function(e){var r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});addEventListener('pointerleave',function(){mx=my=-999});
  /* timeline: 5 holds with 4 morphs between, then the collapse into the semicircle */
  var SEG=[[0,.13],[.19,.3],[.36,.47],[.53,.64],[.7,.8]],cur=-1,shake=0;
  function stateAt(Pp){for(var i=0;i<5;i++){if(Pp<SEG[i][1])return i===0||Pp>=SEG[i][0]?{a:i,b:i,t:0}:{a:i-1,b:i,t:(Pp-SEG[i-1][1])/(SEG[i][0]-SEG[i-1][1])}}
    return Pp<.86?{a:4,b:4,t:0}:{a:4,b:5,t:cl((Pp-.86)/.12)}}
  function frame(now){
    var r=$('track').getBoundingClientRect(),tot=$('track').offsetHeight-innerHeight,Pp=cl(-r.top/tot);
    if(r.bottom<0||r.top>innerHeight||!N){requestAnimationFrame(frame);return}
    $('bar').style.width=(Pp*100)+'%';
    var s=stateAt(Pp),idx=s.t<.5?s.a:Math.min(4,s.b);
    if(idx!==cur){cur=idx;$('ci').textContent='0'+(idx+1);L.h.t=L.p.t='';say('h',F[idx].h,80);say('p',F[idx].p,80+F[idx].h.length*34*.6)}
    var moving=s.t>0&&s.t<1,blast=Math.sin(Math.PI*s.t);document.querySelector('.cap').style.opacity=s.b===5?(1-sm(0,.5,s.t)).toFixed(3):1;
    /* motion trails while the dots fly, a clean frame while they rest */
    if(moving&&!reduce){x.fillStyle='rgba(11,16,32,.32)';x.fillRect(0,0,W,H)}else x.clearRect(0,0,W,H);
    /* faint background grid, like the rest of the site */
    x.fillStyle='rgba(184,146,90,.12)';for(var gy=STEP*2;gy<H;gy+=STEP*3)for(var gx=STEP*2;gx<W;gx+=STEP*3)x.fillRect(gx,gy,1.2,1.2);
    var A=SH[s.a],B=s.b<5?SH[s.b]:ARC,cxm=W/2,cym=H*.45,t=now/1000;
    for(var i=0;i<N;i++){var a=A[i],b=B[i],p=P[i];
      var e=reduce?(s.t>.5?1:0):sm(p.d*.35,p.d*.35+.65,s.t);
      var px=a.x+(b.x-a.x)*e,py=a.y+(b.y-a.y)*e;
      /* explosion: dots burst out from the centre mid-flight */
      if(!reduce&&blast>0){var dx=px-cxm,dy=py-cym,dl=Math.sqrt(dx*dx+dy*dy)+1,k=Math.sin(Math.PI*e)*(s.b===5?60:160)*p.sp;px+=dx/dl*k+Math.cos(p.ang)*k*.35;py+=dy/dl*k+Math.sin(p.ang)*k*.35}
      /* cursor repel */
      var rx=px-mx,ry=py-my,rd=rx*rx+ry*ry,tx=0,ty=0;if(rd<8100&&!reduce){var f=(1-Math.sqrt(rd)/90)*26/(Math.sqrt(rd)+.01);tx=rx*f;ty=ry*f}
      p.ox+=(tx-p.ox)*.18;p.oy+=(ty-p.oy)*.18;px+=p.ox;py+=p.oy;
      var dust=(e<.5?a.dust:b.dust),acc=(e<.5?a.a:b.a);
      if(dust&&!moving){x.globalAlpha=.08;x.fillStyle='#B8925A';x.fillRect(px,py,1.2,1.2);continue}
      if(b.hide){if(e>=1)continue;x.globalAlpha=(1-e)*(dust?.25:1)}else x.globalAlpha=dust?.25:1;x.fillStyle=s.b===5&&e>.6?'#B8925A':acc?'#E8963A':'#D9B25F';
      var rr=(STEP*.36)*(dust?.5:1)*(1+.12*Math.sin(t*2+p.ang)*(moving?0:1));x.beginPath();x.arc(px,py,rr,0,6.283);x.fill()}
    x.globalAlpha=1;text(now);requestAnimationFrame(frame)}
  function go(){build();cur=-1;requestAnimationFrame(frame)}
  addEventListener('resize',function(){build()});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);else go();
})();
</script>

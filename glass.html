<title>Glassy ulazak blokova</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Demo of three things for the "Own your customer journey" section:
   1) iOS-style liquid glass on every block (blur + saturation, light rim, specular sheen, light that follows the cursor),
   2) AirDrop-style entrance: each block arrives from the left or right as a small blurred glowing drop, springs open with a slight
      overshoot, a ring of light ripples out, then its text decodes,
   3) the navbar pill: the active highlight is a liquid glass blob that springs to the clicked item and stretches while it moves. */
:root{
  --navy:#0B1020; --gold:#D9B25F; --orange:#E8963A; --ink:#F3EEE3; --muted:#A7AEC2; --line:rgba(255,255,255,.12);
  --display:'Montserrat',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.2,1.25,.35,1);
  color-scheme:dark;
}
html,body{margin:0;background:var(--navy);color:var(--ink)}
body{font-family:var(--display)}
*{box-sizing:border-box}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;position:relative}
.tag{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.noise{font-family:var(--mono);color:var(--orange)}.rest{color:transparent}

/* glass needs something behind it: slow, blurred colour fields in the page background */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:10vh;background:radial-gradient(circle,#24345f,transparent 70%)}
.bgfx i:nth-child(2){width:36vw;height:36vw;right:-8vw;top:40vh;background:radial-gradient(circle,rgba(217,178,95,.35),transparent 70%);animation-duration:28s}
.bgfx i:nth-child(3){width:30vw;height:30vw;left:30vw;bottom:-12vh;background:radial-gradient(circle,rgba(232,150,58,.22),transparent 70%);animation-duration:34s}
@keyframes drift{to{transform:translate(6vw,-5vh) scale(1.15)}}
main{position:relative;z-index:1}

/* ---------- liquid glass ---------- */
.glass{position:relative;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 45%,rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 0 1px rgba(255,255,255,.02),0 20px 60px -20px rgba(0,0,0,.6);
  overflow:hidden;isolation:isolate}
/* specular sheen + light that follows the cursor */
.glass:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 55%)}
.glass.sm{border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02))}
.glass.sm.on{background:linear-gradient(145deg,rgba(217,178,95,.28),rgba(217,178,95,.08));border-color:rgba(217,178,95,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 30px -10px rgba(217,178,95,.45)}

/* ---------- AirDrop-style entrance ---------- */
.drop{opacity:0}
.drop.in{animation:airdrop 1.05s var(--spring) both}
.drop.in.from-r{animation-name:airdropR}
@keyframes airdrop{
  0%{opacity:0;transform:translateX(-46vw) scale(.18);filter:blur(22px) brightness(1.8);border-radius:999px}
  35%{opacity:1;filter:blur(8px) brightness(1.4)}
  62%{transform:translateX(1.5%) scale(1.03);filter:blur(0) brightness(1.08)}
  80%{transform:translateX(-.4%) scale(.995)}
  100%{opacity:1;transform:none;filter:none}}
@keyframes airdropR{
  0%{opacity:0;transform:translateX(46vw) scale(.18);filter:blur(22px) brightness(1.8);border-radius:999px}
  35%{opacity:1;filter:blur(8px) brightness(1.4)}
  62%{transform:translateX(-1.5%) scale(1.03);filter:blur(0) brightness(1.08)}
  80%{transform:translateX(.4%) scale(.995)}
  100%{opacity:1;transform:none;filter:none}}
/* the ring of light that ripples out when a block lands */
.ripple{position:absolute;left:50%;top:50%;width:140%;aspect-ratio:1;border-radius:50%;pointer-events:none;z-index:2;transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle,transparent 58%,rgba(217,178,95,.45) 63%,rgba(255,255,255,.25) 64.5%,transparent 70%);opacity:0}
.drop.in .ripple{animation:ripple .9s .5s ease-out both}
@keyframes ripple{0%{opacity:.9;transform:translate(-50%,-50%) scale(.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
/* small inner cards pop in after their parent lands */
.pop{opacity:0;transform:scale(.6);filter:blur(6px)}
.in .pop{animation:pop .6s var(--spring) both;animation-delay:calc(.75s + var(--i,0) * 70ms)}
@keyframes pop{to{opacity:1;transform:none;filter:none}}

/* ---------- navbar: liquid glass with a springy blob ---------- */
.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:6px;border-radius:999px}
.nav .blob{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;z-index:0;
  background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px -6px rgba(0,0,0,.6),0 0 0 1px rgba(217,178,95,.25);will-change:transform,width}
.nav button{position:relative;z-index:1;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:15px;padding:12px 20px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .3s}
.nav button[aria-current="true"]{color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ---------- section content ---------- */
section{padding-top:150px;padding-bottom:110px}
h2{margin:12px 0 14px;font-weight:900;font-size:clamp(30px,3.8vw,54px);line-height:1.05;letter-spacing:-.02em;min-height:2.1em}
h2 em{font-style:normal;color:var(--gold)}
.lead{margin:0;color:var(--muted);font-size:17px;line-height:1.55;max-width:58ch;min-height:4.6em}
.board{margin-top:36px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{padding:24px}
.bk{display:flex;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.bk b{display:block;font-size:19px;font-weight:900}
.bk span{display:block;color:var(--muted);font-size:13.5px;margin-top:4px;font-family:var(--mono)}
.bk .pr{font-weight:800;font-size:19px;color:var(--gold);white-space:nowrap}
.q{margin:18px 0 10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.adds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.add{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;color:var(--ink);font-family:var(--display);cursor:pointer;transition:transform .35s var(--spring),border-color .3s,background .3s}
.add:hover{transform:translateY(-2px) scale(1.01)}
.add:active{transform:scale(.97)}
.add i{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:900;color:transparent;transition:all .3s var(--spring)}
.add.on i{background:var(--gold);border-color:var(--gold);color:var(--navy);transform:scale(1.12)}
.add b{display:block;font-size:14px;font-weight:800}
.add small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.add em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:13px;color:var(--gold);white-space:nowrap}
.plan h3{margin:0 0 4px;font-size:21px;font-weight:900;min-height:1.2em}
.plan .ps{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.day{padding:12px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day h4{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.day li{display:flex;gap:10px;font-size:14.5px}
.day li span{font-family:var(--mono);font-size:12.5px;color:var(--muted);width:44px}
.day li.x{color:var(--gold);font-weight:700}
.day li.new{animation:pop .5s var(--spring) both}
.val{margin-top:14px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.val .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--muted)}
.val .tot{font-weight:900;font-size:34px;color:var(--gold);font-variant-numeric:tabular-nums}
.ben{margin-top:26px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.ben .glass{padding:18px}
.ben b{display:block;font-family:var(--mono);font-size:12px;color:var(--orange);margin-bottom:8px}
.ben strong{display:block;font-size:15px;margin-bottom:6px;min-height:1.2em}
.ben span{font-size:13px;line-height:1.5;color:var(--muted)}
.replay{margin-top:40px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
@media (max-width:1000px){.ben{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.board,.adds,.ben{grid-template-columns:minmax(0,1fr)}.nav button{font-size:13px;padding:10px 12px}section{padding-top:120px}}
@media (prefers-reduced-motion:reduce){.drop,.pop{opacity:1!important;animation:none!important;transform:none!important;filter:none!important}.ripple{display:none}.bgfx i{animation:none}}
</style>

<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>

<nav class="nav glass" id="nav" aria-label="Glavni meni">
  <span class="blob" id="blob" aria-hidden="true"></span>
  <button type="button">Usluge</button><button type="button" aria-current="true">Put kupca</button><button type="button">Portfolio</button><button type="button">Kontakt</button>
</nav>

<main>
<section class="pad"><div class="wrap">
  <div class="tag">Own your customer journey · nastavak</div>
  <h2 data-dec="Od jedne rezervacije do celog vikenda." data-html="Od jedne rezervacije <em>do celog vikenda.</em>">&nbsp;</h2>
  <p class="lead" data-dec="Na platformi se kupovina uglavnom završava na sobi. Na vašem sistemu soba može da bude tek početak: gost sam slaže ostatak boravka, a sve plaća na jednom mestu." data-ms="9"></p>

  <div class="board">
    <div class="panel glass drop" data-from="l"><span class="ripple"></span>
      <div class="bk"><div><b data-dec="Kuća pod Fruškom"></b><span>Pet 20. – Ned 22. jun · 2 gosta</span></div><div class="pr">180 €</div></div>
      <div class="q" data-dec="Dodajte svom boravku"></div>
      <div class="adds" id="adds"></div>
    </div>
    <div class="panel glass plan drop from-r" data-from="r" aria-live="polite"><span class="ripple"></span>
      <h3 data-dec="Vaš vikend"></h3>
      <p class="ps" id="ps">Za sada samo smeštaj. Dodajte nešto levo.</p>
      <div id="days"></div>
      <div class="val"><span class="k">VREDNOST REZERVACIJE</span><span class="tot" id="tot">180 €</span></div>
    </div>
  </div>

  <div class="ben" id="ben"></div>
  <button class="replay" id="replay" type="button">↻ Ponovi ulazak</button>
</div></section>
</main>

<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function cl(x){return Math.max(0,Math.min(1,x))}
  var $=function(id){return document.getElementById(id)};
  var GL='ABCDEFGHIJKLMNOPRSTUVZŠĐČĆŽ0123456789#%/+<>';
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function decode(el,t,ms,delay,html){if(reduce){el.innerHTML=html||esc(t);return}var st=performance.now()+(delay||0),n=t.length;el.dataset.t2=t;el.innerHTML='<span class="rest">'+esc(t)+'</span>';
    (function step(now){if(el.dataset.t2!==t)return;var q=cl((now-st)/(n*ms)),d=Math.floor(q*n),nz=(q<=0||q>=1)?0:Math.min(4,n-d),z='';for(var j=0;j<nz;j++){var ch=t[d+j];z+=ch===' '?' ':GL[(Math.random()*GL.length)|0]}
      el.innerHTML=q>=1&&html?html:esc(t.slice(0,d))+'<span class="noise">'+esc(z)+'</span><span class="rest">'+esc(t.slice(d+nz))+'</span>';if(q<1)requestAnimationFrame(step)})(performance.now())}
  function decodeIn(root,base){[].forEach.call(root.querySelectorAll('[data-dec]'),function(el,i){decode(el,el.dataset.dec,el.dataset.ms?+el.dataset.ms:28,base+i*120,el.dataset.html||null)})}

  /* content */
  var A=[['Transfer sa aerodroma','Beograd → kuća, vozač čeka',70,0,'14:00'],['Vino na dolasku','Boca lokalnog vina u kući',25,0,'15:00'],['Privatni kuvar','Večera za dvoje u kući',120,0,'20:00'],['Doručak u korpi','Domaći proizvodi sa salaša',30,1,'09:00'],['Tura po vinarijama','Fruška gora, sa vodičem',60,1,'11:00'],['Vožnja Dunavom','Privatni čamac, zalazak sunca',90,1,'18:30']];
  var on=[],last=-1,shown=180;
  A.forEach(function(a,i){var b=document.createElement('button');b.type='button';b.className='add glass sm pop';b.style.setProperty('--i',i);b.setAttribute('aria-pressed','false');
    b.innerHTML='<i aria-hidden="true">✓</i><div><b data-dec="'+a[0]+'"></b><small>'+a[1]+'</small></div><em>+'+a[2]+' €</em>';
    b.addEventListener('click',function(){on[i]=!on[i];b.classList.toggle('on',on[i]);b.setAttribute('aria-pressed',on[i]?'true':'false');last=on[i]?i:-1;render()});$('adds').appendChild(b)});
  function render(){var it=[[0,'15:00','Dolazak i ulazak u kuću',0,-1],[2,'11:00','Odjava',0,-1]];A.forEach(function(a,i){if(on[i])it.push([a[3],a[4],a[0],1,i])});
    var D=['Petak, 20. jun','Subota, 21. jun','Nedelja, 22. jun'],h='';D.forEach(function(dn,d){var x=it.filter(function(t){return t[0]===d}).sort(function(a,b){return a[1]<b[1]?-1:1});if(!x.length)return;
      h+='<div class="day"><h4>'+dn+'</h4><ul>'+x.map(function(t){return '<li class="'+(t[3]?'x':'')+(t[4]===last?' new':'')+'"><span>'+t[1]+'</span>'+t[2]+'</li>'}).join('')+'</ul></div>'});$('days').innerHTML=h;
    var ex=A.reduce(function(s,a,i){return s+(on[i]?a[2]:0)},0),n=on.filter(Boolean).length;$('ps').textContent=n?'Smeštaj i '+n+(n===1?' dodatak':n<5?' dodatka':' dodataka')+'. Sve u jednoj rezervaciji.':'Za sada samo smeštaj. Dodajte nešto levo.';
    var to=180+ex,from=shown,t0=performance.now();(function st(now){var k=reduce?1:cl((now-t0)/500);shown=from+(to-from)*(1-Math.pow(1-k,3));$('tot').textContent=Math.round(shown)+' €';if(k<1)requestAnimationFrame(st)})(t0)}
  render();
  var B=[['Veća vrednost rezervacije','Gost dokupljuje ono što prirodno ide uz boravak.'],['Iskustvo po meri','Gost bira kako izgleda njegov vikend.'],['Kontrola nad ponudom','Vi odlučujete šta nudite i s kim sarađujete.'],['Direktan odnos','Svoja baza gostiju, uz njihovu saglasnost.'],['Prostor za rast','Nove usluge i partneri kako biznis raste.']];
  B.forEach(function(b,i){var d=document.createElement('div');d.className='glass drop'+(i%2?' from-r':'');d.dataset.from=i%2?'r':'l';d.style.animationDelay=(i*.08)+'s';
    d.innerHTML='<span class="ripple"></span><b>0'+(i+1)+'</b><strong data-dec="'+b[0]+'"></strong><span>'+b[1]+'</span>';$('ben').appendChild(d)});

  /* entrance: blocks drop in when they scroll into view, then their text decodes */
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;var el=e.target;io.unobserve(el);el.classList.add('in');decodeIn(el,reduce?0:650+parseFloat(el.style.animationDelay||0)*1000)})},{threshold:.2});
  /* headline + lead decode on load (outside the blocks) */
  decode(document.querySelector('h2'),document.querySelector('h2').dataset.dec,40,200,document.querySelector('h2').dataset.html);decode(document.querySelector('.lead'),document.querySelector('.lead').dataset.dec,9,700);
  [].forEach.call(document.querySelectorAll('.drop'),function(el){io.observe(el)});
  $('replay').addEventListener('click',function(){[].forEach.call(document.querySelectorAll('.drop'),function(el){el.classList.remove('in');void el.offsetWidth;io.observe(el)})});


  /* navbar: spring physics for the blob; it stretches with speed and settles with a little wobble */
  var nav=$('nav'),blob=$('blob'),btns=[].slice.call(nav.querySelectorAll('button')),x=0,w=0,vx=0,vw=0,tx=0,tw=0,anim=false;
  function target(b){var nr=nav.getBoundingClientRect(),r=b.getBoundingClientRect();tx=r.left-nr.left;tw=r.width}
  function step(){var k=reduce?1:.16,d=reduce?0:.62;vx=(vx+(tx-x)*k)*d;vw=(vw+(tw-w)*k)*d;x+=vx;w+=vw;if(reduce){x=tx;w=tw}
    var stretch=Math.min(.35,Math.abs(vx)/60);blob.style.width=w+'px';blob.style.transform='translateX('+x+'px) scaleX('+(1+stretch)+') scaleY('+(1-stretch*.35)+')';
    if(Math.abs(tx-x)>.3||Math.abs(vx)>.3||Math.abs(tw-w)>.3){requestAnimationFrame(step)}else{anim=false;blob.style.transform='translateX('+tx+'px)'}}
  function go(b){btns.forEach(function(o){o.setAttribute('aria-current',o===b?'true':'false')});target(b);if(!anim){anim=true;requestAnimationFrame(step)}}
  btns.forEach(function(b){b.addEventListener('click',function(){go(b)})});
  function init(){var a=btns.filter(function(b){return b.getAttribute('aria-current')==='true'})[0];target(a);x=tx;w=tw;blob.style.width=w+'px';blob.style.transform='translateX('+x+'px)'}
  init();addEventListener('resize',init);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(init);
})();
</script>

<title>Sistem iza ekrana i uloga sajta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: pinned stage. Seven big words climb a staircase from bottom-left to top-right as you scroll
   (the "JUST ONE → MORE → TWEAK" move from the reference), each decoding in; the active one shows the question we ask.
   At the end a gold line loops from the last step back to the first: learning feeds the next round. */
:root{
  --navy:#0B1020; --line:#2A3658; --gold:#D9B25F; --orange:#E8963A; --ink:#F3EEE3; --muted:#A7AEC2; --dim:#3a4566;
  --display:'Montserrat',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{margin:0;background:var(--navy);color:var(--ink)}
body{font-family:var(--display)}
*{box-sizing:border-box}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.spacer{min-height:50vh;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.track{position:relative;height:calc(7 * 60vh + 140vh)}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.wrap{position:relative;height:100%;max-width:1440px;margin:0 auto;--px:clamp(16px,4vw,60px)}
.wrap.pad{padding-left:var(--px);padding-right:var(--px)}
.head{position:absolute;left:var(--px);top:9vh;display:flex;flex-direction:column;gap:12px;max-width:520px;z-index:2}
.tag{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h2{margin:0;font-weight:900;font-size:clamp(26px,2.8vw,40px);line-height:1.05;letter-spacing:-.02em}
h2 em{font-style:normal;color:var(--gold)}
.sub{margin:0;color:var(--muted);font-size:15px;line-height:1.5;max-width:42ch}
svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.w{position:absolute;display:flex;flex-direction:column;gap:6px;transition:opacity .5s ease}
.w .n{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--muted);font-variant-numeric:tabular-nums}
.w .t{font-weight:900;font-size:clamp(30px,4.6vw,72px);line-height:.95;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap;color:var(--dim);transition:color .5s ease}
.w .q{font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--gold);width:30ch;min-height:3em;opacity:0;transition:opacity .4s ease}
@media (min-width:861px){.w .q{position:absolute;left:calc(100% + 28px);top:22px}}
.w.seen .t{color:#6f7a99}
.w.act .t{color:var(--ink)}
.w.act .n{color:var(--orange)}
.w.act .q{opacity:1}
.w.last.act .t{color:var(--gold)}
.noise{font-family:var(--mono);color:var(--orange)}.rest{color:transparent}
.end{position:absolute;right:var(--px);bottom:8vh;max-width:460px;text-align:right;font-size:clamp(18px,1.8vw,24px);font-weight:800;line-height:1.35;opacity:var(--e,0);transform:translateY(calc((1 - var(--e,0))*14px))}
.end em{font-style:normal;color:var(--gold)}
.dots{position:absolute;left:var(--px);bottom:3vh;display:flex;gap:6px}
.dots i{width:22px;height:3px;border-radius:2px;background:var(--line);transition:background .4s}
.dots i.on{background:var(--gold)}
@media (max-width:860px){
  .head{top:4vh;gap:6px}.sub{display:none}
  h2{font-size:clamp(20px,5.6vw,26px)}
  .w .t{font-size:clamp(26px,8.4vw,38px)}
  .w .q{font-size:11.5px;max-width:26ch}
  .end{left:var(--px);right:var(--px);bottom:7vh;text-align:left;font-size:16px;max-width:none}
}
@media (prefers-reduced-motion:reduce){.w,.w .t,.w .q,.dots i{transition:none}}

/* the rise: projects stay pinned, this section slides up over them like a sheet */
.stack{position:relative}
.prev{position:sticky;top:0;height:100vh;height:100svh;display:flex;align-items:center;overflow:hidden;transform-origin:50% 0;will-change:transform,filter}
.pv{width:100%;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.pv h3{margin:0;font-weight:900;font-size:clamp(26px,3.2vw,46px);line-height:1.05;letter-spacing:-.02em}
.pcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,3vw,40px)}
.pc{aspect-ratio:16/10;border-radius:16px;border:1px solid var(--line);display:flex;align-items:flex-end;padding:16px}
.pc b{font-weight:900;font-size:clamp(14px,1.8vw,26px)}
.pline{height:2px;background:var(--gold);position:relative;border-radius:2px}
.pline i{position:absolute;right:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--orange)}
.phint{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rise{z-index:2;background:var(--navy);border-radius:32px 32px 0 0;box-shadow:0 -30px 80px rgba(0,0,0,.55);border-top:1px solid var(--line)}
.rise .stage{border-radius:32px 32px 0 0}
.rise .wrap{opacity:var(--in,1);transform:translateY(calc((1 - var(--in,1))*60px))}
@media (max-width:860px){.pcards{grid-template-columns:minmax(0,1fr)}.pc{aspect-ratio:21/9}.rise,.rise .stage{border-radius:22px 22px 0 0}}

/* ================= 08 · Sistem iza ekrana: laptop opens, powers on, cards fly out and shuffle ================= */
#sis .track{position:relative;height:1700vh}
#sis .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#s-gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#sis .txt{position:absolute;inset:0;display:flex;align-items:center;pointer-events:none;z-index:2}
#sis .txt .wrap{height:auto;width:100%;max-width:1440px;margin:0 auto;padding-left:clamp(16px,4vw,60px);padding-right:clamp(16px,4vw,60px)}
#sis .in{max-width:min(500px,36%);display:flex;flex-direction:column;gap:14px}
#sis h2{margin:0;font-weight:900;font-size:clamp(28px,3.2vw,50px);line-height:1.03;letter-spacing:-.02em;min-height:2.06em}
#sis .sub{margin:0;font-size:clamp(15px,1.25vw,18px);line-height:1.55;color:var(--muted);min-height:4.6em}
#sis .layers{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
#sis .layers li{display:flex;gap:12px;align-items:baseline;font-size:14px;color:#5d6788;transition:color .35s}
#sis .layers li b{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.14em;width:178px;flex-shrink:0;white-space:nowrap}
#sis .layers li.on{color:var(--ink)}#sis .layers li.on b{color:var(--gold)}#sis .layers li.done{color:#8f98b5}
@media (max-width:860px){#sis .txt{align-items:flex-end;padding-bottom:22px}#sis .in{max-width:none;gap:8px}#sis h2{font-size:clamp(22px,6.4vw,28px);min-height:2.1em}#sis .sub{font-size:14px;min-height:4.6em}#sis .layers{display:none}}
@media (prefers-reduced-motion:reduce){#sis .layers li{transition:none}}
#sis .roles{display:none;flex-direction:column;gap:12px;pointer-events:auto}
#sis.rolemode .roles{display:flex}#sis.rolemode .layers{display:none}
#sis .chips{display:flex;flex-wrap:wrap;gap:8px}
#sis .chips button{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(11,16,32,.6);color:var(--muted);cursor:pointer;transition:all .25s}
#sis .chips button:hover{border-color:#4a5880;color:var(--ink)}
#sis .chips button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(217,178,95,.12)}
#sis .chips button:focus-visible,#sis .rcta:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
#sis .rc{border:1px solid var(--line);border-radius:14px;padding:16px;background:rgba(15,22,40,.82)}
#sis .rc b{display:block;font-size:20px;font-weight:900;min-height:1.2em}
#sis .rc p{margin:6px 0 0;font-size:14.5px;line-height:1.5;min-height:3em}
#sis .rc small{display:block;margin-top:8px;font-size:13px;color:var(--muted);line-height:1.45;min-height:2.9em}
#sis .rc small i{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--gold);margin-right:6px}
#sis .rcta{align-self:flex-start;font-weight:800;font-size:14.5px;padding:12px 20px;border-radius:999px;background:var(--gold);color:var(--navy);text-decoration:none}
#sis .rcta:hover{background:#f0cf85}
#sis .rnote{font-size:12.5px;color:var(--muted)}
@media (max-width:860px){#sis .roles{gap:8px}#sis .chips button{font-size:10.5px;padding:7px 9px}#sis .rc{padding:12px}#sis .rc b{font-size:17px}#sis .rc p{font-size:13.5px;min-height:2.9em}#sis .rc small,#sis .rnote{display:none}#sis.rolemode .sub{display:none}}

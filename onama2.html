<html lang="sr">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --navy:#080C14; --line:#2A3658; --gold:#D9B25F; --orange:#E8963A; --ink:#F3EEE3; --muted:#A7AEC2;
  --display:'Montserrat',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{margin:0;background:var(--navy);color:var(--ink)}
html{overflow-x:clip}
body{font-family:var(--display)}
*{box-sizing:border-box}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.spacer{min-height:45vh;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.track{position:relative;height:1200vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;left:0;right:0;bottom:clamp(22px,6vh,64px);pointer-events:none;transition:opacity .2s}
.cap .wrap{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,4vw,56px);align-items:end}
.meta{display:flex;flex-direction:column;gap:8px}
.tag{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.cnt{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--muted);font-variant-numeric:tabular-nums}
.cnt b{color:var(--orange);font-weight:600}
.txt{max-width:640px}
.txt h2{margin:0 0 8px;font-weight:900;font-size:clamp(20px,2.2vw,32px);line-height:1.12;letter-spacing:-.01em;min-height:1.15em}
.txt p{margin:0;color:var(--muted);font-size:clamp(14px,1.2vw,17px);line-height:1.55;min-height:3.1em}
.noise{font-family:var(--mono);color:var(--orange)}.rest{color:transparent}
.bar{position:absolute;left:0;top:0;height:3px;background:var(--gold);width:0}
/* Ideje naslov (kao na sajtu) */
.ideje{position:absolute;left:6vw;top:11vh;opacity:0;pointer-events:none}
.ideje .k{font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.ideje h2{margin:14px 0 0;font-weight:900;font-size:clamp(34px,3.6vw,64px);line-height:1.02;letter-spacing:-.02em;min-height:2.1em}
.ideje h2 em{font-style:normal;color:var(--gold)}
.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--navy);display:block}
.hint{position:absolute;left:0;right:0;bottom:28px;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(167,174,194,.75);pointer-events:none;transition:opacity .3s}
.hint i{display:block;width:1px;height:28px;margin:10px auto 0;background:linear-gradient(var(--gold),transparent);animation:hd 1.6s ease-in-out infinite}
@keyframes hd{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media (prefers-reduced-motion:reduce){.hint i{animation:none}}
@media (max-width:760px){.cap .wrap{grid-template-columns:minmax(0,1fr);gap:10px}.meta{flex-direction:row;gap:14px;align-items:baseline}.ideje{top:9vh}}
</style>
</head>

  function build(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);STEP=W<760?8:12;

  var GL='ABCDEFGHIJKLMNOPRSTUVZŠĐČĆŽ0123456789#%/+<>',L={h:{el:$('th'),ms:34},p:{el:$('tp'),ms:13}};

  var mx=-999,my=-999;addEventListener('pointermove',function(e){var r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});addEventListener('pointerleave',function(){mx=my=-999});

  /* globalna vremenska linija:
     0.00–0.09  video (zamena)            0.07–0.15  tačke iz ekrana → BULEVAR.IT

  var V1=.15, LA=.14, O0=.24, O1=.74, S1=.95;

  /* HERO VIDEO (Higgsfield / Kling 3.0): skrol pomera video kadar po kadar.

  var HV=$('hv'),vReady=false,vT=0;

  pickVideo();

  function frame(now){
    var r=$('track').getBoundingClientRect(),tot=$('track').offsetHeight-innerHeight,G=cl(-r.top/tot);

    if(G<O0){

        for(var i=0;i<N;i++){var b=SH[0][i],p=P[i];
          if(b.dust)continue;
          var q=logoPos(b,e0,t);if(!q.vis)continue;
          x.globalAlpha=Math.min(1,q.q===undefined?1:q.q*4);x.fillStyle=b.a?'#D9B25F':'#F3EEE3';x.beginPath();x.arc(q.x,q.y,LST*.4,0,6.283);x.fill()}
        x.globalAlpha=1}
      text(now);requestAnimationFrame(frame);return}

    /* ---- FAZA B: originalna O nama (nepromenjena) ---- */
    var Pp=cl((G-O0)/(O1-O0));
    var stream=cl((G-O1)/(S1-O1)), se=eio(stream);
    var s=stateAt(Pp),idx=s.t<.5?s.a:Math.min(4,s.b);

    var moving=(s.t>0&&s.t<1)||(stream>0&&stream<1),blast=Math.sin(Math.PI*s.t);
    $('cap').style.opacity=s.b===5?(1-sm(0,.5,s.t)).toFixed(3):1;
    if(moving&&!reduce){x.fillStyle='rgba(8,12,20,.32)';x.fillRect(0,0,W,H)}else x.clearRect(0,0,W,H);
    var gridA=.12*(1-se);x.fillStyle='rgba(184,146,90,'+gridA+')';if(gridA>.005)for(var gy=STEP*2;gy<H;gy+=STEP*3)for(var gx=STEP*2;gx<W;gx+=STEP*3)x.fillRect(gx,gy,1.2,1.2);
    var A=SH[s.a],B=s.b<5?SH[s.b]:ARC,cxm=W/2,cym=H*.45;
    /* geometrija mlaza (prvi kadar sekcije „Ideje“): luk koji ulazi gore levo, prolazi ispod i izlazi gore desno */
    var mob=W<760,sCx=W*.46,sCy=-H*.3,sR=Math.max(W*.44,H*.68);
    for(var i=0;i<N;i++){var a=A[i],b=B[i],p=P[i];
      var e=reduce?(s.t>.5?1:0):sm(p.d*.35,p.d*.35+.65,s.t);
      var ax=a.x,ay=a.y,bx=b.x,by=b.y;
      if(s.a===0&&!a.dust&&a.L!==undefined){var qa=logoPos(a,1,t);ax=qa.x;ay=qa.y}
      var px=ax+(bx-ax)*e,py=ay+(by-ay)*e;
      if(!reduce&&blast>0){var dx=px-cxm,dy=py-cym,dl=Math.sqrt(dx*dx+dy*dy)+1,k=Math.sin(Math.PI*e)*(s.b===5?60:160)*p.sp;px+=dx/dl*k+Math.cos(p.ang)*k*.35;py+=dy/dl*k+Math.sin(p.ang)*k*.35}

      /* ---- FAZA C: tačke iz „1“ odlaze levo-gore, do početka luka, pa luk ide sleva nadesno (kao „Ideje“) ---- */
      if(stream>0&&s.b===5){var q=ARC[i],qq=reduce?se:cl((stream-p.d*.3-q.u*.25)/.45);
        var arcAt=function(u,th){var an=Math.PI*1.12+(Math.PI*.02-Math.PI*1.12)*u;return[sCx+Math.cos(an)*(sR+th),sCy+Math.sin(an)*(sR+th)]};
        var thick=(mob?14:26)+(mob?40:90)*Math.pow(q.u,2.2),st0=arcAt(0,p.j*thick*.3),fin;
        if(qq<.3){var k1=sm(0,.3,qq);px=q.x+(st0[0]-q.x)*k1;py=q.y+(st0[1]-q.y)*k1}
        else{var k2=1-Math.pow(1-(qq-.3)/.7,2),uu=q.u*k2;if(qq>=1){uu=q.u+t*.035;uu-=Math.floor(uu)}fin=arcAt(uu,p.j*thick*(.3+.7*k2));px=fin[0];py=fin[1]}
        var mix=sm(0,.4,qq);col=[217+(232-217)*mix,178+(150-178)*mix,95+(58-95)*mix];
        alpha=q.dust?.25+.75*mix:1;var uq=qq>=1?uu:q.u;if(qq>=1){if(uu>.85)alpha*=cl((1-uu)/.15)*.8+.2;if(uu<.04)alpha*=uu/.04}
        rad=(STEP*.36)*(q.dust?.5+.4*mix:1);hidden=false;dust=false}
      if(hidden)continue;

      var rx=px-mx,ry=py-my,rd=rx*rx+ry*ry,tx=0,ty=0;if(rd<8100&&!reduce){var f=(1-Math.sqrt(rd)/90)*26/(Math.sqrt(rd)+.01);tx=rx*f;ty=ry*f}

      if(s.a===0&&s.b===0&&!dust){rad=LST*.4}else if(s.a===0&&!dust&&a.L!==undefined){rad=LST*.4+(STEP*.36-LST*.4)*e}
      var rr=rad*(1+.12*Math.sin(t*2+p.ang)*(moving||s.a===0?0:1));x.beginPath();x.arc(px,py,rr,0,6.283);x.fill()}
    x.globalAlpha=1;
    /* sjaj iskre */
    if(false){var gl=sm(.55,1,s.t)*(1-sm(.15,.6,stream)),pul=1+.15*Math.sin(t*6);
      if(gl>.01){var rg=x.createRadialGradient(SPK.x,SPK.y,0,SPK.x,SPK.y,90*pul);rg.addColorStop(0,'rgba(255,190,110,'+(.55*gl)+')');rg.addColorStop(1,'rgba(232,150,58,0)');x.fillStyle=rg;x.beginPath();x.arc(SPK.x,SPK.y,90*pul,0,6.283);x.fill()}}
    /* Ideje naslov */
    var io=sm(.88,.94,G);$('ideje').style.opacity=io.toFixed(3);$('ideje').style.transform='translateY('+((1-io)*18).toFixed(1)+'px)';
    if(io>.3&&!IH.on){IH.on=true;IH.st=now}if(io<.05&&IH.on){IH.on=false;IH.h='';$('ih').innerHTML=''}
    text(now);ideje(now);requestAnimationFrame(frame)}
  function go(){build();cur=-1;requestAnimationFrame(frame)}
  addEventListener('resize',function(){pickVideo();build()});
  var fr=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('900 100px Montserrat'),document.fonts.ready]).catch(function(){}):Promise.resolve();
  Promise.all([fr,LM.decode?LM.decode().catch(function(){}):new Promise(function(r){LM.onload=r})]).then(go);
})();
